name: OSM2XP Tycho Build

on:
  push:
    branches: [ master, develop, java11_flightgear ]
  pull_request:
    branches: [ master, develop, java11_flightgear ]
  workflow_dispatch:

jobs:
  build:
    name: Build (core + console + RCP app)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      # Tycho 1.5.0 emits an invalid collect request for Bundle-ClassPath system
      # dependencies on Maven 3.10+; pin the last known-good Maven 3.9.x.
      - name: Set up Maven 3.9.12
        run: |
          curl -fsSL https://archive.apache.org/dist/maven/maven-3/3.9.12/binaries/apache-maven-3.9.12-bin.tar.gz -o "$RUNNER_TEMP/maven.tar.gz"
          tar -xzf "$RUNNER_TEMP/maven.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.9.12/bin" >> "$GITHUB_PATH"

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      # Poms installed by the reactor builds below declare com.osm2xp.build as parent;
      # install it so the later, separate reactor builds can read those descriptors.
      - name: Install build parent POM
        run: mvn -B -ntp -N install -f releng/pom.xml

      # Tycho reactor: com.osm2xp.core, com.osm2xp.classification.core, com.osm2xp.generation
      - name: Build Tycho core modules
        run: mvn -B -ntp install -f releng-core/pom.xml -DskipTests

      # Plain Maven module; bundles the core jars into a runnable osm2xpc distribution
      - name: Build console distribution
        run: mvn -B -ntp install -f releng-console/pom.xml -DskipTests

      # Eclipse RCP product (needs the core bundles installed above in the local p2 index)
      - name: Build RCP application
        run: mvn -B -ntp install -f releng-app/pom.xml -DskipTests

      - name: Upload Tycho bundles
        uses: actions/upload-artifact@v4
        with:
          name: osm2xp-tycho-bundles
          path: |
            com.osm2xp.core/target/com.osm2xp.core-*.jar
            com.osm2xp.generation/target/com.osm2xp.generation-*.jar
            com.osm2xp.classification.core/target/com.osm2xp.classification.core-*.jar
          if-no-files-found: error
          retention-days: 30

      - name: Upload console distribution
        uses: actions/upload-artifact@v4
        with:
          name: osm2xpc-console
          path: |
            builds/bin/osm2xpc-*.zip
            builds/bin/osm2xpc-*.tgz
          if-no-files-found: error
          retention-days: 30

      - name: Upload application distribution
        uses: actions/upload-artifact@v4
        with:
          name: osm2xp-application
          path: |
            builds/bin/osm2xp-*.zip
            builds/bin/osm2xp-*.tar.gz
          if-no-files-found: error
          retention-days: 30
